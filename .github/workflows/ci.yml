# Checagem de tipos, testes, build e imagem Docker da API.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (tsc + testes + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: api
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          load: true
          tags: healthia-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sobe a imagem e confere /health
        run: |
          docker run -d --name api -p 8080:8080 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e CORS_ORIGIN=https://exemplo.invalid \
            -e HEALTHIA_MODO_PILOTO=true \
            -e GEMINI_PROVEDOR=demonstracao \
            healthia-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          docker logs api
          exit 1
