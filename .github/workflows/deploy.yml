# Deploy da API no Cloud Run, com Gemini via Vertex AI (credenciais do próprio serviço, sem chave).
# Roda depois do CI verde na main, ou manualmente. Fica inativo até as variáveis do repositório
# serem configuradas (Settings > Secrets and variables > Actions > Variables).
# Guia completo: https://github.com/FMU-Tech-Inovacao-2026-2/pitchInicial/blob/main/docs/deploy.md
name: Deploy Cloud Run

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Workload Identity Federation: token OIDC de curta duração, sem chave JSON.

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  SERVICO: ${{ vars.CLOUD_RUN_SERVICO_API || 'healthia-api' }}
  REGIAO: ${{ vars.GCP_REGION || 'southamerica-east1' }}
  IMAGEM: ${{ vars.GCP_REGION || 'southamerica-east1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO || 'healthia' }}/api:${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    name: Build, push e deploy
    if: vars.GCP_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build e push da imagem
        run: |
          gcloud auth configure-docker "${REGIAO}-docker.pkg.dev" --quiet
          docker build --target runner -t "$IMAGEM" .
          docker push "$IMAGEM"

      - name: Deploy
        env:
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          GEMINI_PROVEDOR: ${{ vars.GEMINI_PROVEDOR || 'vertex' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          VERTEX_LOCATION: ${{ vars.VERTEX_LOCATION || 'us-central1' }}
          PROJETO: ${{ vars.GCP_PROJECT_ID }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          SEGREDO_JWT: ${{ vars.JWT_SECRET_NAME || 'healthia-jwt-secret' }}
        run: |
          test -n "$CORS_ORIGIN" || { echo "Defina a variável CORS_ORIGIN com a URL do front-end."; exit 1; }
          # Delimitador @ porque CORS_ORIGIN pode ter vírgulas.
          # max-instances=1: os dados ficam em memória nesta versão; várias instâncias perderiam consistência.
          gcloud run deploy "$SERVICO" \
            --image "$IMAGEM" \
            --region "$REGIAO" \
            --service-account "$RUNTIME_SA" \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --set-secrets "JWT_SECRET=${SEGREDO_JWT}:latest" \
            --set-env-vars "^@^NODE_ENV=production@TRUST_PROXY=1@HEALTHIA_MODO_PILOTO=true@LOG_LEVEL=info@CORS_ORIGIN=${CORS_ORIGIN}@GEMINI_PROVEDOR=${GEMINI_PROVEDOR}@GEMINI_MODEL=${GEMINI_MODEL}@GOOGLE_CLOUD_PROJECT=${PROJETO}@GOOGLE_CLOUD_LOCATION=${VERTEX_LOCATION}"

      - name: Confere /health
        run: |
          URL=$(gcloud run services describe "$SERVICO" --region "$REGIAO" --format 'value(status.url)')
          echo "API: $URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/health"
